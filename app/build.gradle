plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fountainpdl.bible'
    compileSdk 34

    defaultConfig {
        applicationId "com.fountainpdl.bible"
        minSdk 26
        targetSdk 34
        // Every CI build gets a higher versionCode than the one before, so a new
        // APK always installs over the old one as an update.
        versionCode 100 + (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
        versionName "3.1"
    }

    // One fixed signing key for every build. CI used to sign each APK with a
    // brand-new random debug key, so Android refused to install an update over the
    // previous version ("package conflicts"). Same key = clean in-place updates.
    signingConfigs {
        shared {
            storeFile file('fountainpdl.jks')
            storePassword 'fountainpdl'
            keyAlias 'fountainpdl'
            keyPassword 'fountainpdl'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'com.google.code.gson:gson:2.10.1'
}
